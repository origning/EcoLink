# EcoLink 的 Nginx 站点配置
#
# 放到：/etc/nginx/sites-available/ecolink
# 启用：ln -s /etc/nginx/sites-available/ecolink /etc/nginx/sites-enabled/ecolink
# 检查：nginx -t    重载：systemctl reload nginx
#
# P1（IP 内测）：保持 server_name _; 用 http://服务器IP 访问即可。
# P5（有域名后）：把 server_name 改成你的域名，并用 certbot 自动加 HTTPS。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 前端静态文件（HashRouter，回退到 index.html 即可）
    root /opt/ecolink/dist;
    index index.html;

    # 备份导入最大 80MB，base64 后会更大，预留 120MB
    client_max_body_size 120m;

    # 业务接口交给本机 Node 服务
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
